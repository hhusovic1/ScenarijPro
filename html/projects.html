<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScenarijPro - Projects</title>
    <link rel="stylesheet" href="../css/projects.css">
</head>
<body>

<div class="app-container">
  <aside class="sidebar">
    <div class="logo">ScenarijPro</div>
    <ul class="nav-menu">
      <li class="nav-item">
        <a href="#" class="nav-link active">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
          </svg>
          Projekti
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          Statistika
        </a>
      </li>
    </ul>
    
    <div class="user-profile">
      <div class="avatar">U</div>
      <div class="user-info">
        <div class="user-name">User</div>
        <div class="user-role">Pro member</div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="header">
      <h1 class="page-title">Svi scenariji</h1>
      <div class="header-actions">
        <input type="text" class="search-input" placeholder="Pretraga">
        <button class="btn-primary" onclick="createNewProject()">+ Novi projekat</button>
      </div>
    </div>

    <div class="projects-grid" id="projects-container">
        <div style="padding: 20px;">Loading projects...</div>
    </div>
  </main>
</div>

<script src="../js/PoziviAjax.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById('projects-container');
        
        fetch('/api/scenarios/all')
            .then(response => response.json())
            .then(scenarios => {
                renderProjects(scenarios);
            })
            .catch(err => {
                console.error(err);
                container.innerHTML = '<p>Error loading projects.</p>';
            });

        function renderProjects(list) {
            let html = '';

            list.forEach(scen => {
                html += `
                <div class="project-card" onclick="openProject(${scen.id})">
                    <div class="card-header">
                        <div>
                            <h3 class="project-title">${scen.title}</h3>
                        </div>
                        <span class="badge">Active</span>
                    </div>
                    <p class="project-subtitle">Scenario ID: ${scen.id}</p>
                    <div class="project-meta">
                        <div class="meta-row">
                            <span class="meta-label">Status: </span>
                            <span class="meta-value">In Progress</span>
                        </div>
                    </div>
                </div>`;
            });

            html += `
            <div class="project-card new-project" onclick="createNewProject()">
                <svg class="new-project-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path>
                </svg>
                <span class="new-project-text">Kreiraj novi scenarij</span>
            </div>`;

            container.innerHTML = html;
        }
    });

    function openProject(id) {
        window.location.href = `writing.html?id=${id}`;
    }

    function createNewProject() {
        const title = prompt("Unesite naziv novog scenarija:");
        if (title) {
            PoziviAjax.postScenario(title, function(status, data) {
                if (status === 200) {
                    openProject(data.id);
                } else {
                    alert("Greška pri kreiranju: " + status);
                }
            });
        }
    }
</script>

</body>
</html>
