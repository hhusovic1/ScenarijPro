<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem za pisanje scenarija</title>
    <link rel="stylesheet" href="../css/writing.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="projects.html" class="back-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: center; color: inherit;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </a>
            <h1 class="project-title" id="scenarioTitle">Loading...</h1>
        </div>
        <div class="header-center">
            <button class="tag-btn">SCENA</button>
            <button class="tag-btn">AKCIJA</button>
            <button class="tag-btn">LIK</button>
            <button class="tag-btn">DIJALOG</button>
        </div>
        <div class="header-right">
            <button class="save-btn" onclick="document.dispatchEvent(new KeyboardEvent('keydown', {'key': 's', 'ctrlKey': true}))">Spasi</button>
        </div>
    </header>

    <div class="editor-toolbar">
        <div class="toolbar-row">
            <button class="toolbar-btn" id="btnBrojRijeci">Broj riječi</button>
            <button class="toolbar-btn" id="btnUloge">Uloge</button>
            <button class="toolbar-btn" id="btnPogresneUloge">Pogrešne uloge</button>
            <button class="toolbar-btn" id="btnGrupisiUloge">Grupiši uloge</button>
            <button class="toolbar-btn" id="btnBrojLinija">Broj linija</button>
            <button class="toolbar-btn" id="btnScenarijUloge">Scenarij</button>

            <input class="toolbar-input" type="text" id="ulogaInput" placeholder="Ime uloge (npr. KIRA)">

            <div class="toolbar-separator">|</div>

            <button class="format-btn" id="btnBold"><b>B</b></button>
            <button class="format-btn" id="btnItalic"><i>I</i></button>
            <button class="format-btn" id="btnUnderline"><u>U</u></button>
        </div>

        <div id="poruke" class="message-box"></div>
    </div>

    <div class="container">
        <aside class="sidebar">
            <h2 class="sidebar-header">Scenes (0)</h2>
            <ul class="scenes-list">

            </ul>
        </aside>

        <main class="editor-container">
            <div class="editor" id="divEditor" contenteditable="true" spellcheck="false"></div>
        </main>
    </div>

    <script src="../js/PoziviAjax.js"></script>
    <script src="../js/EditorTeksta.js"></script>
    <script src="../js/editor.js"></script>

    <script>
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                const text = mutation.target.textContent;
                if (text.startsWith("Loaded: ")) {
                    document.getElementById("scenarioTitle").textContent = text.replace("Loaded: ", "");
                }
            });
        });
        const msgBox = document.getElementById("poruke");
        if(msgBox) observer.observe(msgBox, { childList: true, characterData: true, subtree: true });
    </script>
</body>
</html>
