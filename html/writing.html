<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem za pisanje scenarija</title>
    <link rel="stylesheet" href="../css/writing.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="projects.html" class="back-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: center; color: inherit;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </a>
            <h1 class="project-title" id="scenarioTitle">Loading...</h1>
        </div>
        <div class="header-center">
            <button class="tag-btn">SCENA</button>
            <button class="tag-btn">AKCIJA</button>
            <button class="tag-btn">LIK</button>
            <button class="tag-btn">DIJALOG</button>
        </div>
        <div class="header-right">
            <button class="save-btn" onclick="document.dispatchEvent(new KeyboardEvent('keydown', {'key': 's', 'ctrlKey': true}))">Spasi</button>
        </div>
    </header>

    <div class="editor-toolbar">
        <div class="toolbar-row">
            <label style="display: flex; align-items: center; gap: 5px;">
                <strong>USERID</strong>
                <input type="number" id="userIdInput" value="1" class="toolbar-input" style="width: 60px;">
            </label>
            
            <label style="display: flex; align-items: center; gap: 5px;">
                <strong>SCENARIOID</strong>
                <input type="number" id="scenarioIdInput" value="1" class="toolbar-input" style="width: 60px;">
            </label>
            
            <button class="toolbar-btn" id="btnUcitaj">Učitaj</button>
            
            <div class="toolbar-separator">|</div>
            
            <label style="display: flex; align-items: center; gap: 5px;">
                <strong>NOVI SCENARIJ:</strong>
                <input type="text" id="newScenarioTitle" placeholder="Naslov scenarija" class="toolbar-input" style="width: 150px;">
            </label>
            
            <button class="toolbar-btn" id="btnKreiraj">Kreiraj</button>
        </div>

        <div class="toolbar-row">
            <button class="toolbar-btn" id="btnBrojRijeci">Broj riječi</button>
            <button class="toolbar-btn" id="btnUloge">Uloge</button>
            <button class="toolbar-btn" id="btnPogresneUloge">Pogrešne uloge</button>
            <button class="toolbar-btn" id="btnGrupisiUloge">Grupiši uloge</button>
            <button class="toolbar-btn" id="btnBrojLinija">Broj linija</button>
            <button class="toolbar-btn" id="btnScenarijUloge">Scenarij</button>

            <input class="toolbar-input" type="text" id="ulogaInput" placeholder="Ime uloge (npr. KIRA)">

            <div class="toolbar-separator">|</div>

            <button class="format-btn" id="btnBold"><b>B</b></button>
            <button class="format-btn" id="btnItalic"><i>I</i></button>
            <button class="format-btn" id="btnUnderline"><u>U</u></button>
        </div>

        <div class="toolbar-row server-actions">
            <strong>Server:</strong>

            <input type="number" id="lockLineId" placeholder="ID linije" class="toolbar-input" style="width: 80px;">
            <button class="toolbar-btn" id="btnLockLine">Zaključaj liniju</button>

            <input type="number" id="updateLineId" placeholder="ID linije" class="toolbar-input" style="width: 80px;">
            <input type="text" id="updateLineText" placeholder="Novi tekst" class="toolbar-input" style="width: 150px;">
            <button class="toolbar-btn" id="btnUpdateLine">Ažuriraj liniju</button>

            <div class="toolbar-separator">|</div>

            <input type="text" id="lockCharName" placeholder="Ime lika" class="toolbar-input" style="width: 100px;">
            <button class="toolbar-btn" id="btnLockChar">Zaključaj lika</button>

            <input type="text" id="newCharName" placeholder="Novo ime" class="toolbar-input" style="width: 100px;">
            <button class="toolbar-btn" id="btnUpdateChar">Preimenuj</button>

            <div class="toolbar-separator">|</div>

            <button class="toolbar-btn" id="btnGetDeltas">Log Promjena</button>
            <span id="deltasStatus" style="font-size: 11px; color: #666; margin-left: 5px;"></span>
        </div>

        <div id="poruke" class="message-box"></div>
    </div>

    <div class="container">
        <aside class="sidebar">
            <h2 class="sidebar-header">Scenes (0)</h2>
            <ul class="scenes-list"></ul>
        </aside>

        <main class="editor-container">
            <div class="editor" id="divEditor" contenteditable="true" spellcheck="false"></div>
        </main>
    </div>

    <script src="../js/PoziviAjax.js"></script>
    <script src="../js/EditorTeksta.js"></script>
    <script src="../js/editor.js"></script>
</body>
</html>
