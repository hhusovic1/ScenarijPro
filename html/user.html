<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postavke korisničkog računa</title>
    <link rel="stylesheet" href="../css/user.css">
</head>
<body>
    <div class="container">
        <form class="settings-form">
            <div class="form-header">
                <h1>Postavke korisničkog računa</h1>
                <div class="header-line"></div>
                <p class="subtitle">Upravljajte vašim korisničkim računom, sigurnosnim postavkama i notifikacijama</p>
            </div>

            <section class="form-section account-section">
                <h2>Podaci o korisničkom računu</h2>
                
                <div class="form-group">
                    <label for="fullname">Ime i prezime</label>
                    <input type="text" id="fullname" name="fullname" placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email adresa</label>
                    <input type="email" id="email" name="email" placeholder="john.doe@example.com">
                </div>

                <div class="form-group">
                    <label for="items-per-page">Broj elemenata po stranici</label>
                    <input type="number" id="items-per-page" name="items-per-page" min="1" max="100" value="25">
                </div>
            </section>

            <section class="form-section security-section">
                <h2>Sigurnosne postavke</h2>
                
                <div class="form-group">
                    <label for="password">Nova šifra</label>
                    <input type="password" id="password" name="password" placeholder="* * * * * * * * ">
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="2fa" name="2fa">
                    <label for="2fa">Omogući Two-Factor Authentication (2FA)</label>
                </div>
            </section>

            <section class="form-section notification-section">
                <h2>Notifikacije</h2>
                
                <div class="form-group">
                    <label class="group-label">Preferirani način komunikacije</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="contact-email" name="contact-method" value="email" checked>
                            <label for="contact-email">Email</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="contact-sms" name="contact-method" value="sms">
                            <label for="contact-sms">SMS</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="contact-none" name="contact-method" value="none">
                            <label for="contact-none">None</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="frequency">Notification frequency</label>
                    <select id="frequency" name="frequency">
                        <option value="daily" selected>Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="never">Never</option>
                    </select>
                </div>
            </section>

            <button type="submit" class="submit-btn">Spasi promjene</button>
        </form>
    </div>
</body>
</html>
